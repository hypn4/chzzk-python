[project]
name = "chzzk-python"
dynamic = ["version"]
description = "Unofficial Python SDK for Chzzk (NAVER Live Streaming Platform) API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "hypn4"}
]
keywords = [
    "chzzk", "naver", "live-streaming", "api", "sdk",
    "korean", "streaming", "chat", "websocket"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.1",
    "python-socketio[asyncio_client]>=4.6.0,<5.0.0",
    "websocket-client>=1.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.15.0",
    "rich>=14.3.1",
    "prompt-toolkit>=3.0.52",
    "qrcode>=8.2",
]

[project.scripts]
chzzk = "chzzk.cli.main:app"

[project.urls]
Homepage = "https://github.com/hypn4/chzzk-python"
Repository = "https://github.com/hypn4/chzzk-python"
Documentation = "https://github.com/hypn4/chzzk-python#readme"
"Bug Tracker" = "https://github.com/hypn4/chzzk-python/issues"
Changelog = "https://github.com/hypn4/chzzk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "flask>=3.1.2",
    "mypy>=1.19.1",
    "pyinstaller>=6.18.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "python-dotenv>=1.2.1",
    "pyzbar>=0.1.9",
    "ruff>=0.14.13",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/chzzk/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".mcp.json",
    "CLAUDE.md",
    ".claude/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chzzk"]
exclude = [
    ".mcp.json",
    "CLAUDE.md",
    ".claude/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
