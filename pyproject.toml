[project]
name = "chzzk-python"
version = "0.1.0"
description = "Unofficial Python SDK for Chzzk (NAVER Live Streaming Platform) API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-socketio[asyncio_client]>=4.6.0,<5.0.0",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = [
    "flask>=3.1.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.35.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chzzk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
